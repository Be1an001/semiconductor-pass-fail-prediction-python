project:
  name: secom-pass-fail-mlops-lite
  description: Final Random Forest holdout evaluation settings.

random_seed: 42

data:
  feature_path: data/secom.data
  labels_path: data/secom_labels.data
  names_path: data/secom.names

split:
  test_size: 0.20
  validation_size: 0.20
  stratify: true
  random_state: 42
  threshold_selection_split: validation
  final_evaluation_split: test

preprocessing:
  missingness_threshold: 0.50
  imputation_strategy: median
  tree_path:
    use_pca: false

final_model:
  name: random_forest
  source_run_name: rf_current_config_threshold_tuned
  params:
    n_estimators: 400
    min_samples_leaf: 3
    class_weight: balanced_subsample
    n_jobs: -1
    random_state: 42

threshold:
  source: validation
  selection_metric: balanced_accuracy
  selected_threshold: null
  notebook_reference_threshold: 0.110
  never_tune_on: test

outputs:
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures
  final_test_metrics: outputs/metrics/final_test_metrics.csv
  confusion_matrix: outputs/figures/confusion_matrix.png
  roc_curve: outputs/figures/roc_curve.png
  pr_curve: outputs/figures/pr_curve.png
  feature_importance: outputs/figures/feature_importance.png
  model_card: reports/model_card.md
  experiment_summary: reports/experiment_summary.md

mlflow:
  enabled: false
  tracking_uri: sqlite:///mlflow.db
  experiment_name: secom-rf-screening
